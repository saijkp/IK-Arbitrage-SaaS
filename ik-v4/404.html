<style>
  :root{ --ink:#16140f; --ink-mid:#4a4638; --mute:#8a8070; --gold:#c8922a; --gold-bg:rgba(200,146,42,.08); --teal:#1d6b5e; --paper:#f8f5ef; --white:#fff; --rule:#ddd8cc; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Outfit',sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;}
  a{color:var(--teal);}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}

  .code{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:5.5rem;color:var(--gold);line-height:1;margin:0 0 8px;}
  h1{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;margin:0 0 14px;}
  p{color:var(--mute);font-size:1rem;margin:0 0 32px;max-width:44ch;margin-left:auto;margin-right:auto;}
  .btn{display:inline-block;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:600;font-size:0.9rem;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--gold);color:var(--ink);}
  footer{border-top:1px solid var(--rule);padding:28px 0;color:var(--mute);font-size:0.85rem;}
  footer a{color:var(--mute);}
