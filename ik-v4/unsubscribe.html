<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics: gated behind cookie consent, see /cookie-consent.js -->
<script src="/cookie-consent.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe | IK ENG</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231a1a18'/%3E%3Crect x='10' y='10' width='7' height='44' rx='2' fill='%23c8922a'/%3E%3Cpolygon points='21,10 21,36 37,10 46,10 30,33 46,54 37,54 21,36 21,54' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#16140f; --ink-mid:#4a4638; --mute:#8a8070; --gold:#c8922a; --gold-bg:rgba(200,146,42,.08); --teal:#1d6b5e; --paper:#f8f5ef; --white:#fff; --rule:#ddd8cc; --red:#b84040; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Outfit',sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;}
  a{color:var(--teal);}
  .wrap{max-width:560px;margin:0 auto;padding:0 24px;}
  header.site{border-bottom:1px solid var(--rule);padding:20px 0;background:#1a1a18;}
  header.site .wrap{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.35rem;text-decoration:none;color:#fff;}
  .logo em{color:var(--gold);font-style:normal;}
  main{min-height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 0;}
  h1{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;margin:0 0 14px;}
  p{color:var(--mute);font-size:1rem;margin:0 0 20px;max-width:44ch;margin-left:auto;margin-right:auto;}
  .btn{display:inline-block;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:600;font-size:0.9rem;}
  .btn-primary{background:var(--ink);color:#fff;}
  footer{border-top:1px solid var(--rule);padding:28px 0;color:var(--mute);font-size:0.85rem;}
  footer a{color:var(--mute);}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a href="https://ikeng.co.uk" class="logo">IK <em>ENG</em></a>
  </div>
</header>

<main>
  <div class="wrap" id="content">
    <h1>Working on it…</h1>
    <p>Give us a moment.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    IK Eng Ltd · 125 Great Clowes Street, Manchester M7 1AL · <a href="mailto:sai@ikeng.co.uk">sai@ikeng.co.uk</a> · <a href="/privacy">Privacy Policy</a>
  </div>
</footer>

<script>
(async function () {
  const content = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  const email = (params.get('email') || '').trim();

  if (!email) {
    content.innerHTML = '<h1>No email found</h1><p>This link is missing an email address. Email us directly and we\'ll take care of it.</p><a class="btn btn-primary" href="mailto:sai@ikeng.co.uk">Email sai@ikeng.co.uk</a>';
    return;
  }

  try {
    const resp = await fetch('/.netlify/functions/unsubscribe?email=' + encodeURIComponent(email), { method: 'POST' });
    if (!resp.ok) throw new Error('Request failed');
    content.innerHTML = '<h1>You\'re unsubscribed</h1><p>' + email + ' won\'t receive any more follow-up emails from us. If you change your mind, you\'re always welcome to send a project brief.</p><a class="btn btn-primary" href="https://ikeng.co.uk/">Back to ikeng.co.uk</a>';
  } catch (e) {
    content.innerHTML = '<h1>Something went wrong</h1><p>We couldn\'t process that automatically. Email us and we\'ll unsubscribe you by hand.</p><a class="btn btn-primary" href="mailto:sai@ikeng.co.uk">Email sai@ikeng.co.uk</a>';
  }
})();
</script>

</body>
</html>
