"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

# Netlify's pretty-URL post-processing rewrote every internal link from
# /page.html to /page, so crawlers kept discovering the extensionless form
# while every canonical tag and the sitemap point at /page.html. GSC listed
# these under "Alternative page with proper canonical tag" / "Page with
# redirect". Serve links exactly as written in the source.
[build.processing.html]
  pretty_urls = false

# Canonicalize www -> apex. GSC showed www.ikeng.co.uk/ being crawled and
# ranked as a separate URL from the apex homepage, splitting ranking
# signal between the two instead of consolidating it onto one.
[[redirects]]
  from = "https://www.ikeng.co.uk/*"
  to = "https://ikeng.co.uk/:splat"
  status = 301
  force = true

# ikeng.online (and www) are domain aliases of this site: send every page permanently
# to the same path on ikeng.co.uk. Email on ikeng.online (Zoho MX) is unaffected.
[[redirects]]
  from = "https://ikeng.online/*"
  to = "https://ikeng.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ikeng.online/*"
  to = "https://ikeng.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Ensure deal.html is served correctly
[[redirects]]
  from = "/deal"
  to = "/deal.html"
  status = 200

# Canonicalize the extensionless path onto the .html file for pages where
# GSC showed both URL forms being independently crawled/ranked (each one
# already has a <link rel="canonical"> pointing at the .html version, but
# a canonical tag is only a hint -- a real 301 is what actually stops
# Google indexing/ranking both forms separately).
[[redirects]]
  from = "/property-developers"
  to = "/property-developers.html"
  status = 301
  force = true

